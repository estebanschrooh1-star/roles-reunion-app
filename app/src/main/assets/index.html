<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asignaciones</title>
<meta name="theme-color" content="#C2410C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asignaciones">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--h:24;--s:92%;--al:40%;--ad:62%;
--acc:hsl(var(--h) var(--s) var(--al));--on:#FFFFFF;--hd:var(--acc);--hdi:#FFFFFF;
--bg:hsl(var(--h) 75% 95%);--sur:hsl(var(--h) 100% 99%);--ink:hsl(var(--h) 35% 11%);--mut:hsl(var(--h) 18% 38%);--line:hsl(var(--h) 45% 86%);
--bub:hsl(var(--h) 90% 90%);--bubi:hsl(var(--h) 55% 14%);--sel:hsl(var(--h) 90% 93%);--warn:#B42318;
--gray:#8A8A8A;--wab:#128C4A;--wat:#FFFFFF;--wabd:#128C4A;color-scheme:light}
:root[data-theme="dark"]{--acc:hsl(var(--h) var(--s) var(--ad));--on:hsl(var(--h) 60% 8%);--hd:hsl(var(--h) 62% 26%);
--bg:hsl(var(--h) 28% 8%);--sur:hsl(var(--h) 24% 11%);--ink:hsl(var(--h) 40% 93%);--mut:hsl(var(--h) 18% 70%);--line:hsl(var(--h) 22% 21%);
--bub:hsl(var(--h) 52% 22%);--bubi:hsl(var(--h) 90% 93%);--sel:hsl(var(--h) 40% 17%);--warn:#F87171;
--gray:#BDBDBD;--wab:hsl(var(--h) 24% 11%);--wat:#25D366;--wabd:hsl(var(--h) 22% 21%);color-scheme:dark}
html,body{height:100%;margin:0}
html{--sat:env(safe-area-inset-top,0px);background-color:var(--bg);background-repeat:no-repeat;background-image:linear-gradient(var(--hd),var(--hd)),linear-gradient(var(--sur),var(--sur));background-position:top,bottom;background-size:100% var(--sat),100% env(safe-area-inset-bottom,0px)}
/* iPhone/iPad (app instalada): iOS dibuja un velo difuminado detrás de la barra de estado que baja unos puntos más allá de la zona segura; este margen extra deja el encabezado fuera de ese velo. */
html.ios-sa{--sat:calc(env(safe-area-inset-top,0px) + 18px)}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body,#app,header,nav,.card,.bub,.menu,.info,.dlg,.sheet,input,textarea,select{transition:background-color .35s,color .35s,border-color .35s}
#app{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--sur);overflow:hidden;padding:0 0 env(safe-area-inset-bottom,0px)}
#app::before{content:"";flex:none;height:var(--sat);background:var(--hd);transition:background-color .35s}
header{background:var(--hd);color:var(--hdi);display:flex;align-items:center;gap:2px;padding:4px 6px 4px 16px;min-height:56px}
header h1{flex:1;font-size:20px;margin:0;font-weight:700}
header button{background:none;border:0;border-radius:50%;color:var(--hdi);width:44px;height:44px;min-height:0;padding:0;display:grid;place-items:center;transition:background-color .25s,transform .14s}
header button.on{background:rgba(255,255,255,.22)}
header button:active{background:rgba(255,255,255,.3)}
header svg{width:24px;height:24px}
header [data-a="back"]{font-size:24px;margin-left:-12px;margin-right:4px}
main{flex:1;overflow:auto;padding:14px 16px 20px}
nav{position:relative;display:grid;grid-template-columns:repeat(var(--n,5),1fr);border-top:1px solid var(--line);background:var(--sur)}
nav button{border:0;border-radius:0;background:none;color:var(--mut);font-size:12px;padding:12px 0;transition:color .3s,background-color .2s}
nav button.on{color:var(--acc)}
nav button svg{width:26px;height:26px;display:block;margin:0 auto;transition:transform .32s cubic-bezier(.3,1.4,.5,1)}
nav button.on svg{transform:scale(1.14)}
nav button:active{transform:none;background:var(--sel)}
.ind{position:absolute;top:-1px;left:0;width:calc(100% / var(--n,5));height:3px;background:var(--acc);border-radius:0 0 3px 3px;transform:translateX(calc(var(--i) * 100%));transition:transform .34s cubic-bezier(.3,.8,.25,1),background-color .35s}
button,input,textarea,select{font:inherit}
button{color:var(--ink);background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;cursor:pointer;transition:background-color .3s,color .3s,border-color .3s,transform .14s,box-shadow .3s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea,select{color:var(--ink);background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;transition:background-color .35s,color .35s,border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--sel)}
.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700;width:100%}
.dng{color:var(--warn)}
h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
label input,label textarea,label select{margin-top:4px;font-size:16px}
.exp{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .3s cubic-bezier(.3,.8,.25,1),opacity .25s}
.exp.open{grid-template-rows:1fr;opacity:1}
.exp>.inner{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .3s}
.exp.open>.inner{visibility:visible;transition-delay:0s}
.info{background:var(--sel);border-left:4px solid var(--acc);border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:14px;font-size:14px}
.empty{color:var(--mut);margin:12px 0}
.warn{color:var(--warn);font-size:14px;margin:8px 0}
.cnt{color:var(--mut);font-size:13px;margin:4px 0 8px}
.okn{animation:rise .35s cubic-bezier(.2,.7,.2,1) backwards}
.leg{color:var(--mut);font-size:12.5px;margin:6px 2px 0;line-height:1.35}
.seg{position:relative;display:grid;gap:4px;padding:4px;background:var(--bg);border-radius:14px;margin-bottom:14px}
.card .seg{margin-bottom:0}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:10px 4px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .28s,background-color .28s,transform .14s}
.seg button svg{width:22px;height:22px;display:block;margin:0 auto}
.seg.pl .on{color:var(--on)}
.seg:not(.pl) .on{background:var(--acc);color:var(--on)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;background:var(--acc);border-radius:10px;z-index:0;transition:transform .34s cubic-bezier(.3,.8,.25,1),width .3s,background-color .35s}
.accs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.acc{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:4px 0;min-height:0;font-size:11.5px;color:var(--mut)}
.acc i{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--sur),0 0 0 4px transparent;transition:box-shadow .3s,transform .3s cubic-bezier(.3,1.4,.5,1)}
.acc.on i{box-shadow:0 0 0 2px var(--sur),0 0 0 4px var(--c);transform:scale(1.1)}
.acc.on{color:var(--ink);font-weight:700}
.lk{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.lkh{display:flex;flex-direction:column;align-items:center;gap:12px}
.lkh svg{width:72px;height:72px;border-radius:18px}
.lkh h1{margin:0;font-size:24px}
.lkt{font-size:20px;margin:0}
.lkm{margin:0;color:var(--mut);min-height:1.4em;font-size:15px}
.lkm.err{color:var(--warn)}
.lk .pri,.lk>button{max-width:320px}
.pat{width:min(300px,78vw);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.pat svg{width:100%;height:100%;display:block;touch-action:none}
.pat polyline{fill:none;stroke:var(--acc);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
.pd{fill:var(--mut);transform-box:fill-box;transform-origin:center;transition:transform .16s,fill .16s}
.pd.sel{fill:var(--acc);transform:scale(1.8)}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.drv{display:flex;align-items:center;gap:10px;min-width:0}
.drv svg{width:22px;height:22px;flex:none;color:var(--ink)}
.cloudbox{padding-top:14px}
.cfr{width:auto;min-width:120px}
.upl{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.upl svg{width:22px;height:22px}
.pdfx{padding-top:10px}
.pdfx .stack button{width:100%}
.seg+.leg{margin:-6px 2px 12px}
.sheet button small{display:block;font-size:12.5px;font-weight:400;opacity:.85}
.sheet button.bz{color:var(--warn);background:rgba(220,38,38,.09);border-color:rgba(220,38,38,.38)}
.dlg.wn{border-color:#E8710A}
.dlg.wn h2{color:#E8710A;margin:0 0 8px}
.dlg.wn .pri{background:#E8710A;border-color:#E8710A;color:#fff}
.ib{display:flex;align-items:center;justify-content:center;gap:8px}
.ib svg{width:24px;height:24px}
header button.dim{opacity:.6}
[hidden]{display:none!important}
.pv{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:fade .22s;padding:0 0 env(safe-area-inset-bottom,0px)}
.pv::before{content:"";flex:none;height:env(safe-area-inset-top,0px);background:var(--hd)}
.pvh{background:var(--hd);color:var(--hdi);display:flex;align-items:center;gap:2px;padding:4px 8px;min-height:56px}
.pvh span{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.pvh button{background:none;border:0;border-radius:50%;color:var(--hdi);width:44px;height:44px;min-height:0;padding:0;font-size:24px}
.pvb{flex:1;overflow:auto;touch-action:pan-x pan-y}
.pvw{position:relative;width:100%;padding:8px 0}
.pg{position:relative;width:calc(100% - 16px);margin:0 auto 10px;height:0;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.28)}
.pg canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.pvm{padding:40px 16px;text-align:center;color:var(--mut)}
.ghost{color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0 30px;text-align:center;font-size:15px}
.ghost svg{width:96px;height:96px}
.bub{background:var(--bub);color:var(--bubi);border-radius:18px 18px 18px 4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub.fx-bub{animation:pop .38s cubic-bezier(.2,.9,.3,1.1) backwards}
.bub.fx-bub>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) backwards}
.bub.fx-bub>:nth-child(2){animation-delay:.05s}.bub.fx-bub>:nth-child(3){animation-delay:.1s}.bub.fx-bub>:nth-child(4){animation-delay:.15s}
.bub.fx-bub>:nth-child(5){animation-delay:.2s}.bub.fx-bub>:nth-child(6){animation-delay:.25s}.bub.fx-bub>:nth-child(7){animation-delay:.3s}
.bub.fx-bub>:nth-child(n+8){animation-delay:.35s}
.hd{font-weight:700;font-size:17px}
.slot small{display:block;font-weight:700;font-size:13px;opacity:.75}
.nms{display:flex;flex-wrap:wrap;gap:0 8px}
.nm{background:transparent;border:0;border-bottom:1px dashed currentColor;border-radius:0;color:inherit;font-size:17px;min-height:36px;padding:4px 0;text-align:left}
.nm:disabled{border-bottom-style:solid;opacity:1;cursor:default}
.nm.void{color:var(--warn);font-style:italic}
.cl{white-space:pre-line}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:12px 0}
.stack{display:flex;flex-direction:column;gap:8px}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--wab);color:var(--wat);border-color:var(--wabd);font-weight:700}

html.nt main,html.nt main *,html.nt header,html.nt header *{transition:none!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:6px 12px;font-size:13px;border-radius:999px;transition:background-color .32s,color .32s,border-color .32s,transform .14s}
.chip:active{background:var(--line);color:var(--mut);border-color:var(--line);transition-duration:.25s}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card .pri{margin-top:12px}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tb button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.tb button.on{border-color:var(--acc);color:var(--acc);font-weight:700;background:var(--sel)}
.tb svg{width:18px;height:18px;flex:none}
.menu{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu .on{background:var(--sel);color:var(--acc);font-weight:700}
.plist.fx-list>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) backwards}
.plist.fx-list>:nth-child(2){animation-delay:.03s}.plist.fx-list>:nth-child(3){animation-delay:.06s}.plist.fx-list>:nth-child(4){animation-delay:.09s}
.plist.fx-list>:nth-child(5){animation-delay:.12s}.plist.fx-list>:nth-child(6){animation-delay:.15s}.plist.fx-list>:nth-child(n+7){animation-delay:.18s}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left}
.ph:active{transform:none;background:var(--sel)}
.ph>div{min-width:0;flex:1}
.ph b{display:block;font-weight:600;transition:color .3s}
.ph small{display:block;color:var(--mut);font-size:12.5px}
.ph span{color:var(--warn);font-size:13px;flex:none}
.chev{width:20px;height:20px;flex:none;color:var(--mut);transition:transform .3s cubic-bezier(.3,.8,.25,1)}
.pp.open .chev{transform:rotate(180deg)}
.pp.off .ph b{color:var(--mut);text-decoration:line-through}
.pb{padding:10px 0 4px}
.dlist{position:relative}
.ditem{position:relative}

main.fx-main>:nth-child(5){animation-delay:.12s}main.fx-main>:nth-child(6){animation-delay:.15s}main.fx-main>:nth-child(7){animation-delay:.18s}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes popout{to{opacity:0;transform:scale(.92)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

:root[data-anim="off"] *,:root[data-anim="off"] *::before,:root[data-anim="off"] *::after{animation:none!important;transition:none!important}

/* ===== Rediseño v2: limpio, sin marcos, formas redondeadas ===== */
:root{--sur:hsl(var(--h) 30% 99%);--bg:hsl(var(--h) 26% 95.5%);--line:hsl(var(--h) 22% 90%);--sel:hsl(var(--h) 85% 94%);--bub:hsl(var(--h) 85% 92%);--mut:hsl(var(--h) 10% 42%);--ink:hsl(var(--h) 25% 12%);--hd:var(--sur);--hdi:var(--ink)}

input,textarea,select{border:0;border-radius:16px;background:var(--bg);padding:13px 14px}

.card input,.card textarea,.card select{background:var(--sur)}

.dlist>.card{padding:10px 12px;margin-bottom:10px}

.info{border-left:0;border-radius:18px;background:var(--sel);padding:12px 14px;line-height:1.45}

.bub{border-radius:26px 26px 26px 8px;padding:18px 18px 16px;gap:12px}
.hd{font-size:18px;letter-spacing:-.01em}

.tb button{background:var(--bg)}
.tb button.on{background:var(--sel)}
.menu{border:0;background:var(--bg);border-radius:20px}
.menu button{background:none;border-bottom:1px solid var(--line)}
.ph{border-bottom:1px solid var(--line);padding:14px 4px;min-height:60px}

.pp.open>.ph{border-bottom-color:transparent}
.he{border-bottom:1px solid var(--line);padding:14px 4px}

.sw.on{background:var(--acc)}

.line{padding:3px 0}
.accs{gap:4px}
.acc{background:none}

.acc.on i{box-shadow:0 0 0 3px var(--sur),0 0 0 5px var(--c)}
.cfgm .acc.on i{box-shadow:0 0 0 3px var(--sur),0 0 0 5px var(--c)}
.dlg{border:0;border-radius:26px;padding:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.dlg.wn{border:0}
.sheet{border-top:0;border-radius:28px 28px 0 0;padding:10px 18px 22px}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet button{background:var(--bg)}
.sheet button.bz{background:rgba(220,38,38,.1)}
.toast{border-radius:999px;padding:10px 18px}

/* ===== v3: sombras suaves, barra flotante, pantalla dividida ===== */
:root{--sh1:0 1px 2px rgba(0,0,0,.05),0 8px 20px -12px rgba(0,0,0,.22)}
:root[data-theme="dark"]{--sh1:0 1px 2px rgba(0,0,0,.35),0 8px 20px -12px rgba(0,0,0,.7)}
html.nt0 :not(.pill){transition:none!important}
.card,.cfgm .card{background:var(--bg);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh1)}
.cfgm .card input,.cfgm .card textarea,.cfgm .card select{background:var(--sur)}
.card button:not(.pri):not(.sw):not(.chip):not(.acc):not(.dchip):not(.wa){background:var(--sur)}
.pp,.he{background:var(--bg);border:0;border-radius:20px;box-shadow:var(--sh1);margin:0 0 10px;padding:0 14px}
.ph{border-bottom:0;padding:14px 0}.he{padding:12px 14px}
.dsel{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.chip.all,.card .chip.all{background:hsl(265 70% 94%);color:hsl(265 50% 36%)}

.row .ib{display:flex;align-items:center;justify-content:center;gap:8px}.row .ib svg{width:20px;height:20px}
nav{display:block;position:absolute;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:0;border:0;background:none;z-index:6;pointer-events:none}

.np button{position:relative;z-index:1;height:48px;min-height:0;padding:0;border-radius:999px;background:none;box-shadow:none;color:var(--mut);display:grid;place-items:center}

main:not(.cfgm){padding-bottom:108px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
/* visor PDF dividido */
.pv{inset:auto;top:0;left:0;right:0;margin:0 auto;max-width:520px;height:var(--sph,0px);padding:0;animation:none;overflow:hidden;transition:height .55s cubic-bezier(.05,.85,.2,1)}
.pv::before{display:none}
.pv.full{height:100%;transition:height .35s cubic-bezier(.3,.8,.25,1)}

html.spx #app::before,html.dr #app::before{transition:none}
/* ===== v6: edición en el menú, títulos con ícono, iOS, PDF suave ===== */
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
html.gap body{height:var(--appH)}
/* iOS (app instalada): si el sistema entrega un alto menor al de la pantalla (queda una franja vacía abajo), JS fija --appH al alto real y body pasa a ser la referencia de todo lo "fixed". */
html.gap body{contain:layout}
main{overscroll-behavior-y:contain}
header h1{display:flex;align-items:center;gap:10px}
header h1 svg{width:24px;height:24px;flex:none;color:var(--acc)}
.card h2{display:flex;align-items:center;gap:8px}
.card h2 svg{width:18px;height:18px;flex:none}
.rt{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.sel{font-size:16px}
.ttlw{display:inline-flex;align-items:center;gap:8px;max-width:100%;cursor:text}
.ttlg{display:inline-grid;min-width:2ch;max-width:100%}
.ttlg::after{content:attr(data-v) " ";grid-area:1/1;visibility:hidden;white-space:pre;font-size:22px;font-weight:800;letter-spacing:-.02em;padding:6px 2px;line-height:1.2}
input.ttl{grid-area:1/1;width:100%;min-width:0;background:none!important;box-shadow:none!important;border:0;padding:6px 2px;border-radius:12px;font:inherit;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2;text-align:center;color:var(--ink)}
input.ttl:focus{background:var(--bg)!important;box-shadow:0 0 0 2px var(--acc)!important}
.cl2{position:relative;display:grid;grid-template-columns:1fr;width:100%;padding:6px 28px;border-radius:16px;background:none!important;box-shadow:none;cursor:text}
.clg{grid-area:1/1;visibility:hidden;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:16px;font-weight:500;line-height:1.45;padding:6px 8px}
.clg::after{content:attr(data-v) " "}
textarea.clt{grid-area:1/1;resize:none;overflow:hidden;width:100%;min-height:0;background:none!important;box-shadow:none!important;border:0;padding:6px 8px;border-radius:12px;font:inherit;font-size:16px;font-weight:500;line-height:1.45;text-align:center;color:var(--mut)}
textarea.clt:focus{background:var(--bg)!important;box-shadow:0 0 0 2px var(--acc)!important;color:var(--ink)}
.cl2 .ed{position:absolute;right:6px;top:12px;margin:0;pointer-events:none}
.rtop .rdb{width:46px;height:46px;min-height:0;padding:0;border-radius:50%;display:grid;place-items:center}
.rtop .rdb svg{width:22px;height:22px}
.pg{animation:pvxin .25s ease-out both}
.pg canvas.fi{animation:pvxin .3s ease-out both}
.pvb{animation:pvxin .3s .05s ease-out both}

/* ===== v7: pantallas anchas (PC / tablet horizontal) =====
   Solo aplica con ventanas de al menos 900x520 px: un teléfono, incluso girado, no llega, así que el celular queda igual. */
@media (min-width:900px) and (min-height:520px){
  html,body{background:var(--bg)}
  html{--sat:0px!important}
  #app{max-width:1200px;box-shadow:0 0 0 1px var(--line),0 40px 90px -50px rgba(0,0,0,.45)}
  #app::before{display:none}
  /* pantallas con menú: barra lateral a la izquierda, encabezado y contenido a la derecha */
  #app:has(>nav){display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding:0}
  #app:has(>nav)>header{grid-column:2;grid-row:1;padding-left:28px;padding-right:16px}
  #app:has(>nav)>main{grid-column:2;grid-row:2}
  #app:has(>nav)>nav{grid-column:1;grid-row:1/span 2;position:relative;left:auto;right:auto;bottom:auto;padding:22px 14px;background:var(--bg);pointer-events:auto;display:flex;flex-direction:column}
  .np{display:flex;flex-direction:column;gap:2px;padding:0;background:none;box-shadow:none;border-radius:0}
  :root[data-theme="dark"] .np{background:none;box-shadow:none}
  .np .ind{top:0;bottom:auto;left:0;width:100%;height:52px;transform:translateY(calc(var(--i) * (52px + 2px)));border-radius:16px;box-shadow:0 8px 16px -10px var(--acc)}
  .np button{display:flex;align-items:center;justify-content:flex-start;gap:14px;height:52px;padding:0 16px;border-radius:16px;font-size:15px;font-weight:600;text-align:left}
  .np button svg{flex:none;width:24px;height:24px}
  .np button::after{content:attr(aria-label)}
  .np button:not(.on):hover{background:var(--sel);color:var(--ink)}
  /* contenido centrado y con ancho cómodo */
  main{--mw:780px;padding-left:max(28px,calc((100% - var(--mw)) / 2));padding-right:max(28px,calc((100% - var(--mw)) / 2));padding-top:10px}
  main:has(.bub.msg){--mw:1040px}
  main:not(.cfgm){padding-bottom:40px}
  /* Mensaje: los puestos se reparten en columnas */
  .bub.msg{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));align-items:start;gap:16px}
  .bub.msg>.mh,.bub.msg>.cl2{grid-column:1/-1}
  .bub.msg~.warn,.bub.msg~.cnt,.bub.msg~.stack{max-width:520px;margin-left:auto;margin-right:auto}
  .bub.msg~.stack{width:100%}
  main>.warn,main>.cnt{text-align:center}
  /* detalles de escritorio */
  .toast{bottom:28px!important}
  .ov.bt{align-items:center;padding:24px}
  .sheet{max-width:480px;max-height:80%;border-radius:28px;padding:22px 20px;animation:pop .26s cubic-bezier(.2,.9,.3,1.15)}
  .ov.out .sheet{animation:popout .17s forwards}
  .sheet::before{display:none}
  .dlg{max-width:380px}
  /* visor PDF: ocupa el área de la app y las páginas no se estiran sin límite */
  .pv,.sph{max-width:1200px}
  .pvw{max-width:920px;margin:0 auto}
  .lk,.wel{max-width:520px;margin:0 auto}
  main::-webkit-scrollbar{width:12px}
  main::-webkit-scrollbar-thumb{background:var(--line);border-radius:12px;border:3px solid var(--sur)}
}
@media (min-width:900px) and (min-height:520px) and (hover:hover){
  button:not(:disabled):not(.pri):not(.sw):not(.wa):hover{filter:brightness(.97)}
  :root[data-theme="dark"] button:not(:disabled):not(.pri):not(.sw):not(.wa):hover{filter:brightness(1.12)}
  .pri:hover,.wa:hover{filter:brightness(1.06)}
  .ph:hover{background:var(--sel)}
  .hdl{cursor:grab}
}

  let H = prev.c[0], SV = Math.max(0, Math.min(1, prev.c[1] / 100));

  el.innerHTML = `<div class="dlg whd"><h2>Color de la app</h2><div class="wheel" id="whw"><i class="wdot" id="wdot"></i></div><div class="row"><button id="wno">Cancelar</button><button class="pri" id="wok">Aceptar</button></div></div>`;

  let raf = 0, dragging = false;
  const val = () => [Math.round(H), Math.round(SV * 100), 50];
  const place = () => { const R = w.clientWidth / 2, a = H * Math.PI / 180; dot.style.left = (R + R * SV * Math.sin(a)) + 'px'; dot.style.top = (R - R * SV * Math.cos(a)) + 'px'; };

let ac;
function tone(f1, f2, d, v) {

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function elig(r, used, all) {
  return shuffle(S.people)
    .filter(p => !p.off && p.r.includes(r.id) && !used.has(p.id) && (all || !bz.has(p.id)))
    .sort((a, b) => (S.last[a.id + r.id] || 0) - (S.last[b.id + r.id] || 0) || (S.any[a.id] || 0) - (S.any[b.id] || 0));
}
function gen() {

  const pool = r => S.people.filter(p => !p.off && p.r.includes(r.id) && !bz.has(p.id)).length;
  const used = new Set(), res = {}, now = Date.now(), w = {};
  /* Primero los roles con menos candidatos; a igualdad, primero el rol cuyo candidato lleva más tiempo esperando. */
  rs.forEach(r => { const c = elig(r, new Set())[0]; w[r.id] = c ? now - (S.last[c.id + r.id] || 0) : 0; });
  shuffle(rs).sort((a, b) => pool(a) - pool(b) || w[b.id] - w[a.id]).forEach(r => {
    res[r.id] = [];
    for (let i = 0; i < r.n; i++) {

    toast('\u2713 Copia ' + ({day:'diaria', week:'semanal', month:'mensual'}[S.cloud.freq] || '')); render(); return;
  }
  else if (a === 'hdr') { S.hdr = t.value.trim(); const g = t.closest('.ttlg'); if (g) g.dataset.v = t.value || 'Agregar título'; }
  else if (a === 'cls') { S.cls = t.value.trim(); const g = t.closest('.cl2'); if (g) g.querySelector('.clg').dataset.v = t.value; }
  else if (a === 'rtm') { const m = S.rem.find(x => x.id === t.dataset.id); if (m) { m.time = t.value; save(); syncRem(); render(); } return; }
  else if (a === 'prtm') { S.pdfRem.time = /^\d{2}:\d{2}$/.test(t.value) ? t.value : '09:00'; save(); syncPdfDue(); render(); return; }
  else if (a === 'user') {
    const n = t.value.trim();
    if (!n) { toast('El nombre no puede quedar vacío'); render(); return; }
    S.user = n; save(); syncRem(); toast('\u2713 Nombre guardado'); return;
  }
  save();
});

refreshPdf();
applyTheme();
render();
syncRem();
if (locked && L.mode === 'device') promptDevice();
if (pdfInfo.fresh) window.onPdfShared(true);
checkCloud();
ensureIndex(); syncPdfDue();
if (!WEB) setTimeout(() => updCheck(true), 1500);
setTimeout(warmPdf, 2500);
/* iPhone/iPad: evita que la página entera rebote o quede trabada al arrastrar fuera de las zonas con scroll. */
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
  document.addEventListener('touchmove', e => {
    if (e.touches.length !== 1) return;
    for (let el = e.target; el && el !== document.body; el = el.parentNode) {
      if (el.nodeType !== 1) continue;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      const cs = getComputedStyle(el);
      if (/(auto|scroll)/.test(cs.overflowY) && el.scrollHeight > el.clientHeight) return;
      if (/(auto|scroll)/.test(cs.overflowX) && el.scrollWidth > el.clientWidth) return;
    }
    e.preventDefault();
  }, {passive:false});
}
if (WEB) {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
}
</script>
